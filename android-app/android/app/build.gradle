apply plugin: 'com.android.application'

// Version pour Google Play (node scripts/apk.js play) : signée avec la clé d'envoi de Pampre, que décrit
// android-app/keystore.properties (storeFile, storePassword, keyAlias, keyPassword). Ce fichier et la clé restent sur le
// PC, hors de Git ; sans eux, la version « release » n'est pas signée et Google Play la refuse.
def cleEnvoi = new Properties()
def cleEnvoiFichier = rootProject.file('../keystore.properties')
if (cleEnvoiFichier.exists()) cleEnvoiFichier.withInputStream { cleEnvoi.load(it) }

android {
    namespace = "fr.macave.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Installer à côté de l'appli habituelle, pour essayer une nouvelle version : node scripts/apk.js essai
        applicationId "fr.pampre.app" + (project.findProperty('macaveSuffix') ?: '')
        manifestPlaceholders = [appLabel: project.findProperty('macaveLabel') ?: '@string/app_name']
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Pour Google Play, apk.js donne un numéro qui monte à chaque envoi et le nom de version (la date).
        versionCode((project.findProperty('macaveVersionCode') ?: '1') as int)
        versionName project.findProperty('macaveVersionName') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (cleEnvoi['storeFile']) {
            envoi {
                storeFile rootProject.file('../' + cleEnvoi['storeFile'])
                storePassword cleEnvoi['storePassword']
                keyAlias cleEnvoi['keyAlias']
                keyPassword cleEnvoi['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (cleEnvoi['storeFile']) signingConfig signingConfigs.envoi
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Scanner d'étiquette : scanner de documents de Google (recadrage, redressement), module des services Google.
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
    // Google Drive de la personne (accès drive.file) : connexion et sélecteur de fichiers des services Google.
    implementation "com.google.android.gms:play-services-auth:22.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
